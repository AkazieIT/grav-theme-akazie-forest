extends@: default

form:
  fields:
    tabs:

      fields:
        content:
          type: tab
          title: PLUGIN_ADMIN.CONTENT

          fields:
            header.subtitle:
              type: text
              label: THEME_AKAZIEFOREST.ADMIN.FIELDS.SUBTITLE.LABEL


        blog:
          type: tab
          title: THEME_AKAZIEFOREST.ADMIN.TAB.BLOG

          # Tab content comes from the imported partial. Do not add an empty
          # `fields:` key here — a null `fields` overwrites the imported fields
          # during the blueprint merge and the tab renders empty.
          import@:
            type: partials/blog-bits
